name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Install Capacitor
        run: npm install

      - name: Copy web files to www/
        run: npm run build:web

      - name: Create Android project
        run: npx cap add android && npx cap sync android

      - name: Use TIS SmartCalc icon
        run: bash scripts/set-android-icons.sh

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../TIS-SmartCalc.apk

      - name: Keep APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TIS-SmartCalc-apk
          path: TIS-SmartCalc.apk

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TIS SmartCalc — latest APK
          body: |
            Android APK of TIS SmartCalc, built automatically from the main branch.
            Download **TIS-SmartCalc.apk**, open it on your phone and allow "Install unknown apps".
          files: TIS-SmartCalc.apk
          make_latest: true
