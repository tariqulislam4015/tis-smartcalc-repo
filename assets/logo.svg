<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.55" stop-color="#0f9d58"/>
      <stop offset="1" stop-color="#0b6e6e"/>
    </linearGradient>
    <linearGradient id="lcd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f7d9"/>
      <stop offset="1" stop-color="#c9e7b0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="420" cy="92" r="150" fill="#ffffff" opacity="0.07"/>
  <!-- calculator body -->
  <rect x="120" y="78" width="272" height="356" rx="40" fill="#0f172a"/>
  <rect x="146" y="106" width="220" height="104" rx="16" fill="url(#lcd)"/>
  <text x="160" y="146" font-family="Georgia, serif" font-size="34" font-style="italic" fill="#14532d">∑ x²</text>
  <text x="352" y="196" text-anchor="end" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#14532d">π</text>
  <!-- keys -->
  <g fill="#334155">
    <rect x="148" y="236" width="56" height="40" rx="12"/>
    <rect x="228" y="236" width="56" height="40" rx="12"/>
    <rect x="308" y="236" width="56" height="40" rx="12" fill="#22c55e"/>
    <rect x="148" y="294" width="56" height="40" rx="12"/>
    <rect x="228" y="294" width="56" height="40" rx="12"/>
    <rect x="308" y="294" width="56" height="40" rx="12"/>
    <rect x="148" y="352" width="56" height="40" rx="12"/>
    <rect x="228" y="352" width="56" height="40" rx="12"/>
    <rect x="308" y="352" width="56" height="40" rx="12" fill="#f59e0b"/>
  </g>
  <text x="336" y="266" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">+</text>
  <text x="336" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">=</text>
  <!-- idea spark -->
  <path d="M410 300 l14 34 l36 4 l-28 22 l10 36 l-32 -20 l-32 20 l10 -36 l-28 -22 l36 -4z" fill="url(#spark)" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
</svg>
